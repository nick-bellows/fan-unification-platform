[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fan-unification-platform"
version = "0.1.0"
description = "Fan identity-resolution and warehouse platform: synthetic sources, a lake, a Postgres star schema, measured unification, and BI marts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nick Bellows" }]
dependencies = [
    "boto3>=1.34",
    "duckdb>=1.0",
    "faker>=25",
    "fastapi>=0.111",
    "httpx>=0.27",
    "pandas>=2.2",
    "pandera>=0.20",
    "prefect>=3.0,<4",
    "psycopg[binary]>=3.2",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "splink>=4.0,<5",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
fanuni = "fanuni.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["splink.*", "boto3.*", "botocore.*", "faker.*", "pandera.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: requires the docker compose stack (postgres, minio, salesforce-mock)",
]
