# Builds the Evidence dashboards from a REAL pipeline run — the compose stack
# comes up, the full-size dataset flows through ingest/transform/unify/gates,
# and only then does Evidence extract from the marts. The published site is
# provably the pipeline's output, not hand-fed numbers.
name: site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PREFECT_API_URL: http://localhost:4200/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e .
      # Generate before compose up so the bind-mount sources exist with
      # runner ownership (compose would create them root-owned).
      - run: fanuni generate --seed 42 --fans 5000
      - run: docker compose up -d --build --wait
      - run: fanuni init-db
      - run: fanuni pipeline
      - run: fanuni evaluate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run sources:strict
        working-directory: site
      - run: npm run build:strict
        working-directory: site
      # A green build with empty tables is a presentation false-positive;
      # assert every source in the deployable artifact actually has rows.
      - run: python scripts/check_site_data.py
      # Source rows are necessary but not sufficient: exercise the built site
      # in Chromium and assert that claim-bearing tables render visibly.
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run test:rendered
        working-directory: site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/build
      - run: docker compose down -v
        if: always()

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
