# Local stack. Credentials in this file are local-only defaults and match
# .env.example — nothing here is a real secret.
name: fanuni

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: fanuni
      POSTGRES_PASSWORD: fanuni_local
      POSTGRES_DB: fanuni
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanuni -d fanuni"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # No bucket-init one-shot here: the pipeline's ensure_bucket() creates the
  # lake bucket via boto3, and a service that exits breaks `up --wait` on
  # some compose versions.
  prefect:
    image: prefecthq/prefect:3-python3.12@sha256:3ee8bd910cce51342ccb91f716303ad4b47303bd1fcce916f316dcd489d4d84a
    command: prefect server start --host 0.0.0.0
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - prefectdata:/root/.prefect
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  salesforce-mock:
    build:
      context: .
      dockerfile: docker/salesforce-mock.Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      FANUNI_SF_TOKEN: dev-local-token
      FANUNI_SF_DATA_DIR: /data/sfmock
    volumes:
      - ./data/sfmock:/data/sfmock:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=3)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  miniodata:
  prefectdata:
