# The "operating a production pipeline" evidence: a scheduled end-to-end run
# on the full-size dataset — ingest, transform, unify, quality gates, linkage
# eval — with the run report and eval results kept as artifacts. A failure
# fails the workflow, which notifies via GitHub's standard channels.
name: nightly-pipeline

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    env:
      PREFECT_API_URL: http://localhost:4200/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e .
      # Generate before compose up so the bind-mount sources exist with
      # runner ownership (compose would create them root-owned).
      - run: fanuni generate --seed 42 --fans 5000
      - run: docker compose up -d --build --wait
      - run: fanuni init-db
      - name: full pipeline (ingest -> transform -> quality gates)
        run: fanuni pipeline | tee nightly_run.json
      - name: linkage evaluation against ground truth
        run: fanuni evaluate | tee nightly_eval.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nightly-run-${{ github.run_number }}
          path: |
            nightly_run.json
            nightly_eval.txt
            eval/results/
      - name: stack logs on failure
        if: failure()
        run: docker compose logs --tail 200
