# Local stack. Credentials in this file are local-only defaults and match
# .env.example — nothing here is a real secret.
name: fanuni

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fanuni
      POSTGRES_PASSWORD: fanuni_local
      POSTGRES_DB: fanuni
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanuni -d fanuni"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin
      && mc mb --ignore-existing local/fanuni-lake"

  prefect:
    image: prefecthq/prefect:3-python3.12
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - prefectdata:/root/.prefect
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  salesforce-mock:
    build:
      context: .
      dockerfile: docker/salesforce-mock.Dockerfile
    ports:
      - "8001:8001"
    environment:
      FANUNI_SF_TOKEN: dev-local-token
      FANUNI_SF_DATA_DIR: /data/sfmock
    volumes:
      - ./data/sfmock:/data/sfmock:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=3)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  miniodata:
  prefectdata:
